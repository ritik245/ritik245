# Save this file in your profile repo as: .github/workflows/oss-contributions.yml
# It finds your pull requests to other people's repos and writes them into README.md
# between the <!--OSS:START--> and <!--OSS:END--> markers.

name: Update Open Source Contributions

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 06:00 IST
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build contributions table
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const user = context.repo.owner;
            const q = `is:pr author:${user} -user:${user} is:public`;

            const { data } = await github.rest.search.issuesAndPullRequests({
              q, sort: 'created', order: 'desc', per_page: 15,
            });

            const esc = (s) => s.replace(/\|/g, '\\|');
            const rows = data.items.map((pr) => {
              const repo = pr.repository_url.split('/repos/')[1];
              const merged = pr.pull_request && pr.pull_request.merged_at;
              const status = merged ? '✅ Merged' : pr.state === 'open' ? '🟢 Open' : '❌ Closed';
              return `| [${repo}](https://github.com/${repo}) | [${esc(pr.title)}](${pr.html_url}) | ${status} |`;
            });

            const table = [
              '| Repository | Pull Request | Status |',
              '|---|---|---|',
              ...(rows.length ? rows : ['| — | No contributions yet — your first PR is waiting! | — |']),
            ].join('\n');

            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!--OSS:START-->[\s\S]*?<!--OSS:END-->/,
              `<!--OSS:START-->\n${table}\n<!--OSS:END-->`
            );
            fs.writeFileSync('README.md', updated);

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: update open source contributions" && git push)
